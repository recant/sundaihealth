name: Train BloodNeedNet
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/**'
      - '.github/workflows/train-model.yml'
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  train:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[train-model]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pandas numpy scikit-learn requests pyreadstat
      - run: python training/train_model.py
      - name: Commit trained model
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/model/bloodneed-model.json
          git diff --cached --quiet || git commit -m 'Train BloodNeedNet on NHANES'
          git push
